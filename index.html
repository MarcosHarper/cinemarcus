<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left,#e50914 0%,transparent 25%),
        radial-gradient(circle at bottom right,#00a8ff 0%,transparent 25%),
        #050505;
    overflow:hidden;
    color:white;
}

#particles{
    position:fixed;
    inset:0;
    z-index:0;
}

.page{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2;
}

.page.active{
    display:flex;
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(.96);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.glass{
    width:min(90vw,600px);

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.12);

    border-radius:28px;

    padding:50px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.1);

    text-align:center;
}

.logo{
    font-size:2.8rem;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    opacity:.8;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:18px;
    border:none;
    outline:none;

    border-radius:15px;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:1rem;
}

input::placeholder{
    color:#ccc;
}

.btn{
    border:none;
    cursor:pointer;
    transition:.3s;
    font-weight:700;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-green{
    background:linear-gradient(135deg,#00ff95,#00c56e);
    color:#000;
}

.btn-red{
    background:linear-gradient(135deg,#ff5555,#d40000);
    color:white;
}

.page1-btn{
    margin-top:20px;
    padding:16px 40px;
    border-radius:14px;
}

.confirm-container{
    position:relative;
    width:min(90vw,700px);
    height:450px;
}

.message{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    text-align:center;

    font-weight:700;

    transition:.4s;

    text-shadow:0 0 20px rgba(255,255,255,.3);
}

.buttons-area{
    position:absolute;
    inset:0;
}

#sim{
    position:absolute;
    padding:16px 35px;
    border-radius:14px;
}

#nao{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    padding:16px 35px;
    border-radius:14px;
}

.success{
    text-align:center;
}

.success h1{
    font-size:3rem;
}

.success p{
    margin-top:10px;
    opacity:.8;
}

.player-wrapper{
    width:min(95vw,1200px);
    aspect-ratio:16/9;

    border-radius:24px;

    overflow:hidden;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.7);
}

.player-wrapper iframe{
    width:100%;
    height:100%;
}

</style>
</head>
<body>

<div id="particles"></div>

<!-- PAGINA 1 -->

<div class="page active" id="page1">

    <div class="glass">

        <div class="logo">🎬 CINEMARCUS PREMIUM</div>

        <div class="subtitle">
            Quem vai assistir hoje?
        </div>

        <input
            id="nome"
            placeholder="Digite seu nome">

        <button
            class="btn btn-green page1-btn"
            onclick="irPagina2()">
            PARTIU
        </button>

    </div>

</div>

<!-- PAGINA 2 -->

<div class="page" id="page2">

    <div class="glass confirm-container">

        <div class="message" id="mensagem">
            Tem certeza?
        </div>

        <div class="buttons-area">

            <button
                id="sim"
                class="btn btn-green">
                SIM
            </button>

            <button
                id="nao"
                class="btn btn-red"
                onclick="voltarInicio()">
                NÃO
            </button>

        </div>

    </div>

</div>

<!-- PAGINA 3 -->

<div class="page" id="page3">

    <div class="glass success">

        <h1>🍿 Bom Filme
            (não chora...)
        </h1>

        <p id="nomeFinal"></p>

    </div>

</div>

<!-- PAGINA 4 -->

<div class="page" id="page4">

    <div class="player-wrapper">

        <iframe
        src="https://ok.ru/videoembed/5585063250492?nochat=1"
        frameborder="0"
        allowfullscreen
        allow="autoplay">
        </iframe>

        

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>

tsParticles.load("particles",{
    fullScreen:false,

    particles:{
        number:{
            value:80
        },

        color:{
            value:"#ffffff"
        },

        opacity:{
            value:0.15
        },

        size:{
            value:{
                min:1,
                max:3
            }
        },

        move:{
            enable:true,
            speed:0.6
        }
    }
});

const frases = [
    "Tem certeza?",
    "Pensa mais um pouco...",
    "Ainda dá tempo de mudar de ideia...",
    "Agora não tem volta 😏"
];

let cliques = 0;

const simBtn = document.getElementById("sim");

simBtn.addEventListener("click",clicouSim);

function mostrarPagina(id){

    document.querySelectorAll(".page")
    .forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id)
    .classList.add("active");
}

function irPagina2(){

    const nome =
    document.getElementById("nome").value.trim();

    if(!nome){

        alert("Digite seu nome.");
        return;
    }

    document.getElementById("nomeFinal")
    .innerHTML = nome;

    mostrarPagina("page2");

    posicionarInicial();
}

function posicionarInicial(){

    simBtn.style.left = "50%";
    simBtn.style.top = "180px";
    simBtn.style.transform = "translateX(-50%)";
}

function voltarInicio(){

    cliques = 0;

    document.getElementById("mensagem")
    .innerHTML = frases[0];

    document.getElementById("mensagem")
    .style.fontSize = "1.8rem";

    mostrarPagina("page1");
}

function clicouSim(){

    cliques++;

    if(cliques < 3){

        const card =
        document.querySelector(".confirm-container");

        const msg =
        document.getElementById("mensagem");

        msg.innerHTML = frases[cliques];

        msg.style.fontSize =
            (1.8 + cliques * .6) + "rem";

        const msgX =
            50 + Math.random() * 400;

        const msgY =
            20 + Math.random() * 90;

        msg.style.left = msgX + "px";
        msg.style.top = msgY + "px";
        msg.style.transform = "none";

        const largura =
            card.clientWidth - 130;

        const altura =
            card.clientHeight - 120;

        const x =
            Math.random() * largura;

        const y =
            120 + Math.random() * 180;

        simBtn.style.left = x + "px";
        simBtn.style.top = y + "px";
        simBtn.style.transform = "none";

    }else{

        mostrarPagina("page3");

        setTimeout(()=>{

            mostrarPagina("page4");

        },3000);
    }
}

</script>

</body>
</html>
